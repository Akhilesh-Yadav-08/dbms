<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cricket Live Centre</title>
    <meta name="description" content="A cinematic cricket live centre with match intelligence, player stories and a relational scoring engine." />
    <meta property="og:title" content="Cricket Live Centre" />
    <meta property="og:description" content="A cinematic cricket live centre with match intelligence, player stories and a relational scoring engine." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Fallback utility runtime for restricted local environments. Vite/Tailwind
         remains the normal project build path. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Shared premium shell: deliberately applied only to content surfaces so
         the WebGL trophy remains visually independent. */
      html.dark body { background: #020202; color: #fff7df; letter-spacing: .012em; }
      .site-content { position: relative; }
      .site-content::before { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: -1; background: linear-gradient(180deg, rgba(0,0,0,.04), rgba(0,0,0,.48)); }
      html.dark .site-content [class*="rounded-3xl"],
      html.dark .site-content [class*="rounded-2xl"] { border-radius: 24px 6px 24px 6px; border-color: rgba(231,188,91,.16) !important; box-shadow: 0 26px 80px -58px rgba(0,0,0,.98) !important; }
      html.dark .site-content [class*="bg-slate-950"],
      html.dark .site-content [class*="bg-slate-900"],
      html.dark .site-content [class*="bg-white"],
      html.dark .site-content [class*="bg-blue"],
      html.dark .site-content [class*="bg-emerald"],
      html.dark .site-content [class*="bg-purple"],
      html.dark .site-content [class*="bg-rose"] { background: linear-gradient(112deg, rgba(37,24,6,.66), rgba(2,2,2,.94)) !important; backdrop-filter: blur(18px); }
      html.dark .site-content [class*="border-slate"] { border-color: rgba(198,218,242,.10) !important; }
      html.dark .site-content button { transition: transform .28s cubic-bezier(.16,1,.3,1), color .28s ease, background-color .28s ease, border-color .28s ease, box-shadow .28s ease; }
      html.dark .site-content button:hover { box-shadow: 0 14px 40px -28px rgba(231,188,91,.38); transform: translateY(-2px); }
      html.dark .site-content .grid > [class*="rounded"] { position: relative; overflow: hidden; }
      html.dark .site-content .grid > [class*="rounded"]::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(120deg, rgba(255,226,151,.07), transparent 36%); opacity: .72; }
      html.dark .site-content [class*="text-slate-900"], html.dark .site-content [class*="text-slate-800"], html.dark .site-content [class*="text-slate-700"] { color: #f1f5f9 !important; }
      html.dark .site-content [class*="text-blue"], html.dark .site-content [class*="text-emerald"], html.dark .site-content [class*="text-purple"] { color: #dce9f8 !important; }
      html.dark .site-content h1 { letter-spacing: -.045em !important; line-height: .98 !important; }
      html.dark .site-content h2, html.dark .site-content h3 { letter-spacing: -.02em !important; line-height: 1.15 !important; }
      html.dark .site-content p { line-height: 1.75 !important; }
      html.dark .site-content [class*="py-8"] { padding-top: 3.5rem !important; padding-bottom: 3.5rem !important; }
      html.dark .site-content [class*="space-y-6"] { row-gap: 2rem !important; }
      html.dark .site-content input, html.dark .site-content textarea, html.dark .site-content select { background: rgba(5,10,16,.68) !important; border-color: rgba(198,218,242,.14) !important; }
      @media (prefers-reduced-motion: no-preference) { .site-content > div { animation: rise-in .65s cubic-bezier(.16,1,.3,1) both; } @keyframes rise-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
